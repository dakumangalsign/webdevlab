<!DOCTYPE html>
<html>
<head>
    <title>Sticky Navbar and Card Overlay</title>
    <link rel="stylesheet" href="P08.css">
</head>

<body>

    <header>
        <h2>My Website</h2>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <section class="section">
            <h1>P-4 Sticky Navigation and Card Overlay</h1>

            <p>
                The navigation bar stays at the top
                when the page is scrolled.
            </p>
        </section>

        <div class="overlay-card">

            <div class="image-box">
                My Image
            </div>

            <div class="overlay">
                Student Project
            </div>

            <h3>My Project Card</h3>

            <p>This card has an overlay made using CSS.</p>

        </div>

    </main>

</body>
</html>
